[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "transit-backend"
version = "1.0.0"
description = "Backend предиктора задержек: NDTP, сопоставление с расписанием, прогнозы, API"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "httpx>=0.27", "numpy>=1.26", "pandas>=2.1"]

[tool.setuptools]
packages = ["backend"]
