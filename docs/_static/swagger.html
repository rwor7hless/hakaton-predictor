<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>OpenAPI</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui.css">
</head>
<body>
<div id="ui"></div>
<script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
<script>
  const spec = new URLSearchParams(location.search).get("spec") || "openapi/backend.json";
  SwaggerUIBundle({ url: spec, dom_id: "#ui", supportedSubmitMethods: [] });
</script>
</body>
</html>
